<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Interval Timer">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Interval Timer</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/timer-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/timer-192.png">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="offline.js" defer></script>
  </head>
  <body data-app-version="v6">
    <main>
      <header>
        <h1>Interval Timer</h1>
        <p id="offline-status" role="status">Preparing offline use…</p>
      </header>
      <fieldset class="settings">
        <legend>Workout</legend>
        <div class="settings-grid">
          <div>
            <label for="exercise-seconds">Exercise <span>(seconds)</span></label>
            <input id="exercise-seconds" type="number" inputmode="numeric" min="1" max="3600" step="1" value="10" required aria-describedby="exercise-error">
            <p id="exercise-error" class="field-error" aria-live="polite"></p>
          </div>
          <div>
            <label for="rest-seconds">Rest <span>(seconds)</span></label>
            <input id="rest-seconds" type="number" inputmode="numeric" min="1" max="3600" step="1" value="5" required aria-describedby="rest-error">
            <p id="rest-error" class="field-error" aria-live="polite"></p>
          </div>
          <div>
            <label for="rounds">Rounds</label>
            <input id="rounds" type="number" inputmode="numeric" min="1" max="99" step="1" value="2" required aria-describedby="rounds-error">
            <p id="rounds-error" class="field-error" aria-live="polite"></p>
          </div>
        </div>
        <p id="settings-save-status" class="settings-hint" role="status"></p>
      </fieldset>
      <div class="workout-progress" aria-live="polite" aria-atomic="true">
        <p id="phase-display">Exercise</p>
        <p id="round-display">Round 1 of 2</p>
      </div>
      <p id="time-display" role="timer" aria-label="Time remaining">00:10</p>
      <p id="timer-status" role="status">Ready</p>
      <div class="controls" aria-label="Workout controls">
        <button id="start-button" type="button">Start</button>
        <button id="pause-button" type="button" disabled>Pause</button>
        <button id="reset-button" class="secondary" type="button">Reset</button>
      </div>
      <section id="app-updates" aria-label="App updates" hidden>
        <p id="update-status" role="status"></p>
        <button id="update-button" class="secondary" type="button" hidden>Update app</button>
      </section>
      <footer>
        <button id="sound-button" class="quiet" type="button">Test sound</button>
        <p id="sound-status" role="status"></p>
      </footer>
    </main>
  </body>
</html>
